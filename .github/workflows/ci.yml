name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            tools/requirements-container.txt
            tools/requirements-form-container.txt
            tools/requirements-dev.txt

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install pinned test and lint dependencies
        run: |
          python3 -m pip install --require-hashes -r tools/requirements-container.txt
          python3 -m pip install --require-hashes -r tools/requirements-form-container.txt
          python3 -m pip install --require-hashes -r tools/requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run static checks
        run: ./tools/check.sh

      - name: Run host unit guards
        run: |
          python3 -m unittest discover -s tests -v
          go test ./...
          go vet ./...

  test:
    name: Build and test containers
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build core test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: core
          load: true
          tags: colofon:test
          cache-from: type=gha,scope=core
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=core' || '' }}

      - name: Run core PDF/UA gate
        run: docker run --rm colofon:test test

      - name: Confirm core image excludes PyMuPDF
        run: |
          docker run --rm --entrypoint python3 colofon:test -c \
            "import importlib.util; assert importlib.util.find_spec('pymupdf') is None"
          test "$(docker image inspect colofon:test --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')" = MIT

      - name: Exercise blank-directory quick start
        run: |
          starter="$(mktemp -d)"
          trap 'rm -rf "$starter"' EXIT
          user="$(id -u):$(id -g)"
          docker run --rm --user "$user" -v "$starter:/work" \
            colofon:test init --brand example-studio .
          docker run --rm --user "$user" -v "$starter:/work" \
            colofon:test doc documents/example-report.md -o build/example-report.pdf
          docker run --rm --user "$user" -v "$starter:/work" \
            colofon:test book book/book.yaml -o build/example-book.pdf
          test -s "$starter/build/example-report.pdf"
          test -s "$starter/build/example-book.pdf"

      - name: Smoke-test core MCP server
        run: |
          test "$(docker run --rm --entrypoint /usr/local/bin/colofon-mcp colofon:test --help 2>&1 | head -1)" = "Usage of /usr/local/bin/colofon-mcp:"
          docker run --rm --entrypoint test colofon:test -r /usr/share/licenses/colofon-mcp/MCP-GO-SDK-LICENSE.txt
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/tools"
          cp -R tools/factory-examples "$fixture/tools/"
          python3 tools/mcp_smoke.py -- \
            docker run --rm -i --user "$(id -u):$(id -g)" -v "$fixture:/work" \
            colofon:test mcp --stdio --workspace /work

      - name: Build form test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: forms
          load: true
          tags: colofon-form:test
          cache-from: type=gha,scope=forms
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=forms' || '' }}

      - name: Run form-image gate
        run: |
          docker run --rm colofon-form:test test
          test "$(docker image inspect colofon-form:test --format '{{ index .Config.Labels "org.opencontainers.image.licenses" }}')" = AGPL-3.0-only
          test "$(docker run --rm --entrypoint sha256sum colofon-form:test /usr/share/licenses/colofon-form/AGPL-3.0.txt | cut -d' ' -f1)" = 0d96a4ff68ad6d4b6f1f30f713b18d5184912ba8dd389f86aa7710db079abcb0

      - name: Verify ARM64 core build path
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: core
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=core

      - name: Verify ARM64 form build path
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: forms
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=forms

      - name: Scan core runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: colofon:test
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      - name: Scan form runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: colofon-form:test
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  publish:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate core image metadata
        id: core_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=Colofon
            org.opencontainers.image.description=Themeable Typst document factory with PDF/UA validation
            org.opencontainers.image.licenses=MIT

      - name: Generate form image metadata
        id: form_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-form
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=Colofon Forms
            org.opencontainers.image.description=Colofon with AGPL-licensed fillable-form support
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/AGPL-COMPLIANCE.md
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Build and publish core image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: core
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.core_meta.outputs.tags }}
          labels: ${{ steps.core_meta.outputs.labels }}
          cache-from: type=gha,scope=core
          cache-to: type=gha,mode=max,scope=core
          provenance: mode=max
          sbom: true

      - name: Build and publish form image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: forms
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.form_meta.outputs.tags }}
          labels: ${{ steps.form_meta.outputs.labels }}
          cache-from: type=gha,scope=forms
          cache-to: type=gha,mode=max,scope=forms
          provenance: mode=max
          sbom: true

      - name: Fetch and verify corresponding source
        run: python3 tools/release_assets.py release-assets

      - name: Generate release notes
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub release with corresponding source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Colofon $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            release-assets/*
