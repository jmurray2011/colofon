<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Acme Relay status</title>
  <desc id="desc">A fictional status page with a ready state and three completed checks.</desc>
  <rect width="760" height="420" rx="18" fill="#f7f8fb"/>
  <rect x="32" y="28" width="696" height="64" rx="10" fill="#1f2937"/>
  <text x="58" y="68" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">Acme Relay</text>
  <text x="58" y="138" font-family="sans-serif" font-size="16" fill="#6b7280">SERVICE STATUS</text>
  <circle cx="68" cy="182" r="12" fill="#16a34a"/>
  <text x="94" y="190" font-family="sans-serif" font-size="28" font-weight="700" fill="#111827">Ready</text>
  <g font-family="sans-serif" font-size="18" fill="#1f2937">
    <rect x="48" y="232" width="664" height="48" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="68" y="263">✓ Configuration loaded</text>
    <rect x="48" y="292" width="664" height="48" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="68" y="323">✓ Worker connected</text>
    <rect x="48" y="352" width="664" height="48" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="68" y="383">✓ Storage writable</text>
  </g>
</svg>
